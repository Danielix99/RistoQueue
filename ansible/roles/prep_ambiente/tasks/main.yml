---
# tasks file for prep_ambiente
- name: Crea cluster
  ansible.builtin.command:
    argv:
      - minikube
      - start
      - --profile=risto
      - --driver=docker
      - --memory=2048
      - --cpus=2
      - --ports=30080:30080

- name: installa dip helm
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - tar
      - gzip

- name: Scarica Helm 3
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/install-helm.sh
    mode: "0700"
    force: false

- name: Installa Helm
  become: true
  ansible.builtin.command:
    cmd: bash /tmp/install-helm.sh
    creates: /usr/local/bin/helm