---
- name: Setup risto
  hosts: localhost
  connection: local
  become: false

  vars_prompt:
    - name: api_key_input
      prompt: "Inserisci API key"
      private: true

  vars:
    api_key: "{{ lookup('ansible.builtin.env', 'API_KEY') or api_key_input }}"

  roles:
    - prep_ambiente
    - deploy_app
    - verifica_app