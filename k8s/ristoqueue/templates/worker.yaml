apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2                       
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: marcobuccidev/ristoqueue-worker:{{ .Values.tag }}
          envFrom:
            - configMapRef:
                name: ristoqueue-config
          readinessProbe:         
            exec:
              command: ["python", "/app/healthcheck.py"]
          livenessProbe:
            exec:
              command: ["python", "/app/healthcheck.py"]
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
